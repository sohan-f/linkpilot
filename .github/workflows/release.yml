name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (leave empty to build the selected ref)
        required: false
      publish:
        description: Publish a GitHub release; turn off to only build and collect the artifacts
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
  HAS_KEYSTORE: ${{ secrets.LINKPILOT_KEYSTORE_BASE64 != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -print -quit)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Require tag and keystore when publishing
        if: env.PUBLISH == 'true'
        run: |
          [ -n "$RELEASE_TAG" ] || { echo "::error::A tag is required to publish a release."; exit 1; }
          [ "$HAS_KEYSTORE" = "true" ] || { echo "::error::Signing secrets are required to publish a release."; exit 1; }

      - name: Resolve version
        id: version
        run: |
          label="${RELEASE_TAG:-run-$GITHUB_RUN_NUMBER}"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "name=${label#v}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LINKPILOT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/linkpilot-release.jks

      - name: Build release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LINKPILOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINKPILOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LINKPILOT_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            export LINKPILOT_KEYSTORE=keystore/linkpilot-release.jks
            export LINKPILOT_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export LINKPILOT_KEY_ALIAS="$KEY_ALIAS"
            export LINKPILOT_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            --console=plain

      - name: Verify signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Name artifacts
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "linkpilot-${{ steps.version.outputs.label }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "linkpilot-${{ steps.version.outputs.label }}.aab"

      - name: Upload build artifacts
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linkpilot-${{ steps.version.outputs.label }}
          path: |
            linkpilot-${{ steps.version.outputs.label }}.apk
            linkpilot-${{ steps.version.outputs.label }}.aab
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "linkpilot-$RELEASE_TAG.apk" "linkpilot-$RELEASE_TAG.aab" --clobber
          else
            gh release create "$RELEASE_TAG" "linkpilot-$RELEASE_TAG.apk" "linkpilot-$RELEASE_TAG.aab" \
              --title "LinkPilot $RELEASE_TAG" --generate-notes
          fi
